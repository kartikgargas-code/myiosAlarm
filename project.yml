name: AlarmClock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    DEVELOPMENT_TEAM: ""
targets:
  AlarmClock:
    type: application
    platform: iOS
    sources:
      - path: AlarmClock
      - path: AlarmClock/BuiltInSounds
        type: folder
        buildPhase: resources
      - path: AlarmClock/AudioProcessingService.swift
    info:
      path: AlarmClock/Info.plist
      properties:
        NSAlarmKitUsageDescription: Alarm Clock schedules alarms you explicitly create and test.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock
        PRODUCT_NAME: AlarmClock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: AlarmClock/AlarmClock.entitlements
    dependencies:
      - target: AlarmClockWidgetExtension
        embed: true
      - target: AlarmClockControlExtension
        embed: true
    scheme:
      testTargets:
        - AlarmClockTests
  AlarmClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlarmClockTests
    dependencies:
      - target: AlarmClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.tests
        GENERATE_INFOPLIST_FILE: true

  AlarmClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AlarmClockWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.widget
        INFOPLIST_FILE: AlarmClockWidgetExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: AlarmClockWidgetExtension/AlarmClockWidgetExtension.entitlements

  AlarmClockControlExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AlarmClockControlExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.control
        INFOPLIST_FILE: AlarmClockControlExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: AlarmClockControlExtension/AlarmClockControlExtension.entitlements
