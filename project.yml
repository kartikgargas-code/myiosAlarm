name: AlarmClock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Diagnostic: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    DEVELOPMENT_TEAM: ""
targets:
  AlarmClock:
    type: application
    platform: iOS
    sources:
      - path: AlarmClock
      - path: AlarmClock/BuiltInSounds
        type: folder
        buildPhase: resources
      - path: AlarmClock/AudioProcessingService.swift
      - path: AlarmClock/AlarmCoordinator.swift
      - path: AlarmClock/AlarmKitSchedulingService.swift
      - path: AlarmClock/AlarmProofOfConceptModel.swift
      - path: AlarmClock/BuiltInSounds
      - path: AlarmClock/ContentView.swift
      - path: AlarmClock/NextAlarmProvider.swift
      - path: AlarmClock/ProofAlarmPlan.swift
      - path: AlarmClock/SoundLibrary.swift
      - path: AlarmClock/SoundPickerView.swift
      - path: AlarmClock/SoundPreviewService.swift
      - path: AlarmClock/ThemeManager.swift
      - path: AlarmClock/AppearanceView.swift
      - path: AlarmClock/AlarmEditorView.swift
      - path: AlarmClock/NextAlarmControlView.swift
      - path: AlarmClock/NextOccurrenceControlsView.swift
      - path: AlarmClock/NextAlarmLiveActivity.swift
      - path: AlarmClock/NextAlarmLiveActivityView.swift
      - path: AlarmClock/LiveActivityIntents.swift
      - path: AlarmClock/ExtensionAlarmSchedulingService.swift
      - path: AlarmClock/SharedAlarmService.swift
    info:
      path: AlarmClock/Info.plist
      properties:
        NSAlarmKitUsageDescription: Alarm Clock schedules alarms you explicitly create and test.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        AlarmClockAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        AlarmClockWidgetKind: $(WIDGET_KIND)
        AlarmClockControlKind: $(CONTROL_KIND)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock
        PRODUCT_NAME: AlarmClock
        APP_DISPLAY_NAME: myNextalarm
        APP_GROUP_IDENTIFIER: group.com.example.alarmclock
        WIDGET_KIND: com.example.alarmclock.next-alarm-widget
        CONTROL_KIND: com.example.alarmclock.next-alarm-control
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AlarmClock/AlarmClock.entitlements
      configs:
        Diagnostic:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.diagnostic
          APP_DISPLAY_NAME: AlarmClock Diagnostic
          APP_GROUP_IDENTIFIER: group.com.example.alarmclock.diagnostic
          WIDGET_KIND: com.example.alarmclock.diagnostic.next-alarm-widget
          CONTROL_KIND: com.example.alarmclock.diagnostic.next-alarm-control
          CODE_SIGN_ENTITLEMENTS: AlarmClock/AlarmClockDiagnostic.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIAGNOSTIC_BUILD
    dependencies:
      - target: AlarmClockShared
      - target: AlarmClockWidgetExtension
        embed: true
    scheme:
      testTargets:
        - AlarmClockTests
  AlarmClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlarmClockTests
    dependencies:
      - target: AlarmClock
      - target: AlarmClockShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.tests
        GENERATE_INFOPLIST_FILE: true
      configs:
        Diagnostic:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.diagnostic.tests
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIAGNOSTIC_BUILD

  AlarmClockShared:
    type: framework
    platform: iOS
    sources:
      - path: AlarmClock/NextAlarmSnapshot.swift
      - path: AlarmClock/AlarmModel.swift
      - path: AlarmClock/WidgetDiagnostics.swift
      - path: AlarmClock/AlarmPersistence.swift
      - path: AlarmClock/AlarmEngine.swift
      - path: AlarmClock/AlarmScheduleCalculator.swift
      - path: AlarmClock/NextAlarmLiveActivity.swift
      - path: AlarmClock/LiveActivityIntents.swift
    info:
      path: AlarmClock/AlarmClockShared-Info.plist
      properties:
        CFBundleDisplayName: AlarmClockShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.shared
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: true
      configs:
        Diagnostic:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.diagnostic.shared

  AlarmClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AlarmClockWidgetExtension
      - path: AlarmClock/NextAlarmLiveActivityView.swift
      - path: AlarmClockWidgetExtension/WidgetAlarmService.swift
    dependencies:
      - target: AlarmClockShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.widget
        WIDGET_DISPLAY_NAME: Alarm Clock Widget
        APP_GROUP_IDENTIFIER: group.com.example.alarmclock
        WIDGET_KIND: com.example.alarmclock.next-alarm-widget
        CONTROL_KIND: com.example.alarmclock.next-alarm-control
        INFOPLIST_FILE: AlarmClockWidgetExtension/Info.plist
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_ENTITLEMENTS: AlarmClockWidgetExtension/AlarmClockWidgetExtension.entitlements
      configs:
        Diagnostic:
          PRODUCT_BUNDLE_IDENTIFIER: com.example.alarmclock.diagnostic.widget
          WIDGET_DISPLAY_NAME: AlarmClock Diagnostic
          APP_GROUP_IDENTIFIER: group.com.example.alarmclock.diagnostic
          WIDGET_KIND: com.example.alarmclock.diagnostic.next-alarm-widget
          CONTROL_KIND: com.example.alarmclock.diagnostic.next-alarm-control
          CODE_SIGN_ENTITLEMENTS: AlarmClockWidgetExtension/AlarmClockWidgetExtensionDiagnostic.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIAGNOSTIC_BUILD
