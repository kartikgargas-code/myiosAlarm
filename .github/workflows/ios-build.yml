name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device application
        run: |
          set -o pipefail
          xcodebuild build \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify built AlarmKit usage description
        run: |
          PLIST="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAlarmKitUsageDescription' "$PLIST")" = \
            "Alarm Clock schedules alarms you explicitly create and test."

      - name: Package unsigned IPA container
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/AlarmClock-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-unsigned-ipa
          path: ${{ runner.temp }}/AlarmClock-unsigned.ipa
          if-no-files-found: error
