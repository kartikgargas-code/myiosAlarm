name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate


      - name: Verify Xcode 26 AlarmKit custom sound API
        run: |
          cat > "$RUNNER_TEMP/AlarmKitSoundProbe.swift" <<'SWIFT'
          import ActivityKit
          import AlarmKit
          import SwiftUI

          struct ProbeMetadata: AlarmMetadata {}

          func makeConfiguration(
              schedule: Alarm.Schedule,
              attributes: AlarmAttributes<ProbeMetadata>
          ) -> AlarmManager.AlarmConfiguration<ProbeMetadata> {
              let sound: AlertConfiguration.AlertSound = .named("probe.mp3")
              return .alarm(schedule: schedule, attributes: attributes, sound: sound)
          }
          SWIFT
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios26.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -typecheck "$RUNNER_TEMP/AlarmKitSoundProbe.swift"

      - name: Verify iOS 26 Lock Screen widget and control APIs
        run: |
          cat > "$RUNNER_TEMP/LockScreenProbe.swift" <<'SWIFT'
          import AppIntents
          import SwiftUI
          import WidgetKit

          enum AlarmDestination: String, AppEnum {
              case nextAlarm

              static let typeDisplayRepresentation = TypeDisplayRepresentation(name: "Alarm Destination")
              static let caseDisplayRepresentations: [Self: DisplayRepresentation] = [
                  .nextAlarm: "Next Alarm"
              ]
          }

          struct OpenNextAlarmIntent: OpenIntent {
              static let title: LocalizedStringResource = "Open Next Alarm"

              @Parameter(title: "Destination")
              var target: AlarmDestination

              init() {
                  target = .nextAlarm
              }
          }

          struct AlarmControl: ControlWidget {
              var body: some ControlWidgetConfiguration {
                  StaticControlConfiguration(kind: "com.example.alarmclock.next-alarm-control") {
                      ControlWidgetButton(action: OpenNextAlarmIntent()) {
                          Label("Next Alarm", systemImage: "alarm")
                      }
                  }
              }
          }

          let lockScreenFamilies: [WidgetFamily] = [
              .accessoryCircular,
              .accessoryRectangular,
              .accessoryInline
          ]
          SWIFT
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios26.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -typecheck "$RUNNER_TEMP/LockScreenProbe.swift"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -destination 'platform=iOS Simulator,id=dvtdevice-DVTiOSDeviceSimulatorPlaceholder-iphonesimulator:placeholder' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device application
        run: |
          set -o pipefail
          xcodebuild build \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify built AlarmKit usage description
        run: |
          PLIST="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAlarmKitUsageDescription' "$PLIST")" = \
            "Alarm Clock schedules alarms you explicitly create and test."

      - name: Verify bundled built-in alarm sounds
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app"
          for f in classic-bell digital gentle-wake morning pulse chime soft bright; do
            test -f "$APP/BuiltInSounds/$f.wav" || { echo "Missing bundled sound: $f.wav"; exit 1; }
          done
          echo "All 8 built-in alarm sounds are bundled."

      - name: Embed production App Group entitlement metadata
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app"
          WIDGET="$APP/PlugIns/AlarmClockWidgetExtension.appex"
          FRAMEWORK="$APP/Frameworks/AlarmClockShared.framework"
          ENTITLEMENTS="$RUNNER_TEMP/AlarmClock-production-entitlements.plist"

          cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.example.alarmclock</string>
            </array>
            <key>com.apple.developer.live-activity</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --sign - "$FRAMEWORK"
          codesign --force --sign - --entitlements "$ENTITLEMENTS" --generate-entitlement-der "$WIDGET"
          codesign --force --sign - --entitlements "$ENTITLEMENTS" --generate-entitlement-der "$APP"
          codesign --verify --deep --strict "$APP"

          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/app-entitlements.plist" 2>/dev/null
          codesign -d --entitlements :- "$WIDGET" > "$RUNNER_TEMP/widget-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/app-entitlements.plist")" = "group.com.example.alarmclock"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$RUNNER_TEMP/widget-entitlements.plist")" = "group.com.example.alarmclock"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.live-activity' "$RUNNER_TEMP/app-entitlements.plist")" = "true"

      - name: Package unsigned IPA container
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AlarmClock.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/AlarmClock-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-unsigned-ipa
          path: ${{ runner.temp }}/AlarmClock-unsigned.ipa
          if-no-files-found: error

  diagnostic-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify diagnostic build settings
        run: |
          set -euo pipefail
          SETTINGS="$RUNNER_TEMP/diagnostic-settings.txt"
          xcodebuild -project AlarmClock.xcodeproj -target AlarmClock -configuration Diagnostic -showBuildSettings > "$SETTINGS"
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|SWIFT_ACTIVE_COMPILATION_CONDITIONS' "$SETTINGS"
          grep -Eq 'PRODUCT_BUNDLE_IDENTIFIER = com\.example\.alarmclock\.diagnostic[[:space:]]*$' "$SETTINGS"
          grep -Eq 'CODE_SIGN_ENTITLEMENTS = AlarmClock/AlarmClockDiagnostic\.entitlements[[:space:]]*$' "$SETTINGS"
          grep -Eq 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = .*DIAGNOSTIC_BUILD' "$SETTINGS"

      - name: Run diagnostic configuration tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Diagnostic \
            -destination 'platform=iOS Simulator,id=dvtdevice-DVTiOSDeviceSimulatorPlaceholder-iphonesimulator:placeholder' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES

      - name: Build production reference and diagnostic application
        run: |
          set -o pipefail
          xcodebuild build \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ProductionDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          xcodebuild build \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Diagnostic \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DiagnosticDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify diagnostic isolation and embedded structure
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DiagnosticDerivedData/Build/Products/Diagnostic-iphoneos/AlarmClock.app"
          WIDGET="$APP/PlugIns/AlarmClockWidgetExtension.appex"
          FRAMEWORK="$APP/Frameworks/AlarmClockShared.framework"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.example.alarmclock.diagnostic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "AlarmClock Diagnostic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AlarmClockAppGroupIdentifier' "$APP/Info.plist")" = "group.com.example.alarmclock.diagnostic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET/Info.plist")" = "com.example.alarmclock.diagnostic.widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$WIDGET/Info.plist")" = "AlarmClock Diagnostic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AlarmClockAppGroupIdentifier' "$WIDGET/Info.plist")" = "group.com.example.alarmclock.diagnostic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FRAMEWORK/Info.plist")" = "com.example.alarmclock.diagnostic.shared"
          test -x "$APP/AlarmClock"
          test -x "$WIDGET/AlarmClockWidgetExtension"
          test -x "$FRAMEWORK/AlarmClockShared"

          APP_SETTINGS="$(xcodebuild -project AlarmClock.xcodeproj -target AlarmClock -configuration Diagnostic -showBuildSettings)"
          WIDGET_SETTINGS="$(xcodebuild -project AlarmClock.xcodeproj -target AlarmClockWidgetExtension -configuration Diagnostic -showBuildSettings)"
          grep -q 'CODE_SIGN_ENTITLEMENTS = AlarmClock/AlarmClockDiagnostic.entitlements' <<< "$APP_SETTINGS"
          grep -q 'CODE_SIGN_ENTITLEMENTS = AlarmClockWidgetExtension/AlarmClockWidgetExtensionDiagnostic.entitlements' <<< "$WIDGET_SETTINGS"
          ! grep -q 'com.apple.security.application-groups' AlarmClock/AlarmClockDiagnostic.entitlements
          ! grep -q 'com.apple.security.application-groups' AlarmClockWidgetExtension/AlarmClockWidgetExtensionDiagnostic.entitlements
          grep -q 'DiagnosticAlarmSchedulingService' AlarmClock/AlarmCoordinator.swift
          grep -q '#if DIAGNOSTIC_BUILD' AlarmClock/AlarmKitSchedulingService.swift

      - name: Verify arm64 linkage and runpaths
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DiagnosticDerivedData/Build/Products/Diagnostic-iphoneos/AlarmClock.app"
          WIDGET_EXEC="$APP/PlugIns/AlarmClockWidgetExtension.appex/AlarmClockWidgetExtension"
          FRAMEWORK_EXEC="$APP/Frameworks/AlarmClockShared.framework/AlarmClockShared"

          test "$(lipo -archs "$APP/AlarmClock")" = "arm64"
          test "$(lipo -archs "$WIDGET_EXEC")" = "arm64"
          test "$(lipo -archs "$FRAMEWORK_EXEC")" = "arm64"
          otool -L "$WIDGET_EXEC" | grep -q '@rpath/AlarmClockShared.framework/AlarmClockShared'
          otool -l "$WIDGET_EXEC" | grep -A2 LC_RPATH | grep -q '@executable_path/../../Frameworks'

      - name: Record production and diagnostic Mach-O UUIDs
        run: |
          set -euo pipefail
          PROD="$RUNNER_TEMP/ProductionDerivedData/Build/Products/Release-iphoneos/AlarmClock.app"
          DIAG="$RUNNER_TEMP/DiagnosticDerivedData/Build/Products/Diagnostic-iphoneos/AlarmClock.app"
          {
            echo "Production widget: $(dwarfdump --uuid "$PROD/PlugIns/AlarmClockWidgetExtension.appex/AlarmClockWidgetExtension")"
            echo "Diagnostic widget: $(dwarfdump --uuid "$DIAG/PlugIns/AlarmClockWidgetExtension.appex/AlarmClockWidgetExtension")"
            echo "Production framework: $(dwarfdump --uuid "$PROD/Frameworks/AlarmClockShared.framework/AlarmClockShared")"
            echo "Diagnostic framework: $(dwarfdump --uuid "$DIAG/Frameworks/AlarmClockShared.framework/AlarmClockShared")"
          } | tee "$RUNNER_TEMP/AlarmClock-Diagnostic-UUIDs.txt"

      - name: Package and verify diagnostic IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DiagnosticPayload/Payload"
          cp -R "$RUNNER_TEMP/DiagnosticDerivedData/Build/Products/Diagnostic-iphoneos/AlarmClock.app" "$RUNNER_TEMP/DiagnosticPayload/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/DiagnosticPayload/Payload" "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa" | grep -q 'Payload/AlarmClock.app/PlugIns/AlarmClockWidgetExtension.appex/AlarmClockWidgetExtension'
          unzip -l "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa" | grep -q 'Payload/AlarmClock.app/Frameworks/AlarmClockShared.framework/AlarmClockShared'
          shasum -a 256 "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa" | tee "$RUNNER_TEMP/AlarmClock-Diagnostic-unsigned.ipa.sha256"

      - name: Upload diagnostic IPA and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-Diagnostic-unsigned-ipa
          path: |
            ${{ runner.temp }}/AlarmClock-Diagnostic-unsigned.ipa
            ${{ runner.temp }}/AlarmClock-Diagnostic-unsigned.ipa.sha256
            ${{ runner.temp }}/AlarmClock-Diagnostic-UUIDs.txt
          if-no-files-found: error
